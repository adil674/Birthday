<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Girl I Met Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="room">
  <div class="dust"></div>

  <div class="stage" id="stage">

    <!-- Ribbon bookmark -->
    <div class="ribbon" aria-hidden="true"></div>

    <div class="book" id="book">

      <!-- Back cover (sits under everything, gives the block its thickness) -->
      <div class="back-cover"></div>

      <!-- page edges (the "paper block" look on the closed side) -->
      <div class="page-edges" aria-hidden="true"></div>

      <!-- Leaves are injected here by JS -->
      <div class="stack" id="stack"></div>

      <!-- Cover, sits on top, flips open first -->
      <div class="leaf cover-leaf" id="cover">
        <div class="face front cover-front" id="coverFront">
          <div class="cover-frame">
            <p class="cover-eyebrow">a small book about</p>
            <h1 class="cover-title">The Girl<br>I Met<br>Online</h1>
            <div class="cover-mark">&#10052;</div>
          </div>
        </div>
        <div class="face back cover-inside">
          <p class="inside-text">This book belongs to two people,<br>a screen, and everything that happened after.</p>
          <p class="inside-hint">Turn the page.</p>
        </div>
      </div>

    </div>

    <button class="tap-hint" id="openBtn" type="button">Open the book</button>

    <div class="controls" id="controls" hidden>
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous page">&#10094;</button>
      <div class="progress" id="progress">Cover</div>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next page">&#10095;</button>
      <button class="add-btn" id="addBtn" type="button" title="Add a blank leaf">+ Add pages</button>
    </div>

    <div class="save-toast" id="saveToast">Saved</div>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
