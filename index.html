<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday — from Adil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- ============ CURTAIN ============ -->
  <div id="curtain" class="locked">
    <div class="curtain-panel left"></div>
    <div class="curtain-panel right"></div>
    <div class="tassel">
      <div class="cord"></div>
      <div class="knot"></div>
      <div class="fringe"></div>
    </div>
    <div class="curtain-message">
      <span class="eyebrow">A little something</span>
      <h2>Get ready for a surprise…</h2>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  
  <!-- ============ STAGE ============ -->
  <main id="stage">
    <h1 class="headline">
      Wishing u Happy Birthday
      <span class="from">— from Adil</span>
    </h1>
    <p class="subline">Open the letter, watch the video, and don't skip the gift box 🎁</p>
  
    <div class="stage-grid symmetrical">
        <!-- LEFT COLUMN -->
        <div class="side-col left-col">
          <div class="icon-col">
            <button class="icon-btn" id="letterBtn" aria-haspopup="dialog" aria-label="Open the letter">
              <svg class="envelope" viewBox="0 0 64 64" fill="none">
                <rect x="6" y="18" width="52" height="36" rx="4" fill="#2D1B4E" stroke="#F4B942" stroke-width="2"/>
                <path class="flap" d="M6 20 L32 40 L58 20" stroke="#FF6B9D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 20 L32 40 L58 20" stroke="#F4B942" stroke-width="2" fill="none" opacity=".5"/>
              </svg>
            </button>
            <span class="icon-label">The letter</span>
          </div>
      
          <div class="icon-col">
            <button class="icon-btn" id="giftBtn" aria-haspopup="dialog" aria-label="Open the gift">
              <svg class="gift-icon" viewBox="0 0 64 64" fill="none">
                <rect x="10" y="28" width="44" height="28" rx="3" fill="#2D1B4E" stroke="#F4B942" stroke-width="2"/>
                <rect x="28" y="28" width="8" height="28" fill="#FF6B9D"/>
                <g class="lid">
                  <rect x="6" y="20" width="52" height="12" rx="3" fill="#3C0F2C" stroke="#F4B942" stroke-width="2"/>
                  <rect x="28" y="20" width="8" height="12" fill="#FF6B9D"/>
                  <path d="M32 20 C24 6, 12 8, 18 18 C22 22, 28 21, 32 20 Z" fill="#FF6B9D"/>
                  <path d="M32 20 C40 6, 52 8, 46 18 C42 22, 36 21, 32 20 Z" fill="#F4B942"/>
                </g>
              </svg>
            </button>
            <span class="icon-label">The gift</span>
          </div>
        </div>
      
        <!-- VIDEO CENTER -->
        <div class="video-col">
            <div id="mediaCardContainer"></div> 
        </div>
      
        <!-- RIGHT COLUMN -->
        <div class="side-col right-col">
          <div class="icon-col reasons-col">
            <button class="icon-btn" id="reasonsBtn" aria-haspopup="dialog" aria-label="Open reasons I like you">
              <svg class="heart-icon" viewBox="0 0 64 64" fill="none">
                <path d="M32 54 C32 54 8 40 8 22 C8 12 16 6 24 6 C28 6 32 8 32 14 C32 8 36 6 40 6 C48 6 56 12 56 22 C56 40 32 54 32 54 Z"
                      fill="#FF6B9D" stroke="#F4B942" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </button>  
            <span class="icon-label">Reasons I like you</span>
          </div>
      
          <div class="icon-col">
            <button class="icon-btn" id="bookBtn" aria-haspopup="dialog" aria-label="Open our book">
              <svg class="book-icon" viewBox="0 0 64 64" fill="none">
                <path d="M32 14 C26 10 16 10 10 14 V50 C16 46 26 46 32 50 V14 Z" fill="#2D1B4E" stroke="#F4B942" stroke-width="2" stroke-linejoin="round"/>
                <path d="M32 14 C38 10 48 10 54 14 V50 C48 46 38 46 32 50 V14 Z" fill="#2D1B4E" stroke="#F4B942" stroke-width="2" stroke-linejoin="round"/>
                <path d="M32 16 V48" stroke="#FF6B9D" stroke-width="2"/>
              </svg>
            </button>
            <span class="icon-label">Our book</span>
          </div>
        </div>
      </div>
  </main>
  <div id="letterModalContainer"></div>
  <div id="giftModalContainer"></div>
  <div id="reasonsModalContainer"></div>
    <div id="bookModalContainer"></div>
  <div id="paintModalContainer"></div>
  <div id="swanModalContainer"></div>
  <div id="banglesModalContainer"></div>
  <div id="rosesModalContainer"></div>

<script src="js/script.js"></script>
<script src="js/paint.js"></script>
<script src="js/swan.js"></script>
<script src="js/bangles.js"></script>
<script src="js/rose.js"></script>
<script src="js/mixtape.js"></script>
<script>
  // download the 3D models while she's reading the page, so they're ready when opened
  ['bangles.glb', 'roses.glb'].forEach(f => fetch(f).catch(() => {}));
</script>
</body>
</html>
